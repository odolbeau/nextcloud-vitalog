name: Release

# Push a tag `vX.Y.Z` (matching <version> in appinfo/info.xml) to build the archive and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Build and publish the release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag matches the app version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match info.xml version $version"; exit 1; }
      - run: make package
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/vitalog-*.tar.gz --title "${GITHUB_REF_NAME}" --generate-notes

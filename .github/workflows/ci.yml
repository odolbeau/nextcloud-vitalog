name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-progress --prefer-dist
      - run: npm ci
      - name: PHP code style
        run: composer lint
      - name: Psalm
        run: composer psalm
      - name: ESLint
        run: npm run lint
      - name: Translations are complete
        run: npm run l10n:check

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Nextcloud 34 exige PHP 8.2+, Nextcloud 35 exige PHP 8.3+
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer test

  build:
    name: Front build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-js
          path: js
          retention-days: 1

  e2e:
    name: E2E on Nextcloud ${{ matrix.nextcloud }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # versions de Nextcloud supportées par l'app (info.xml : 34 à 35)
        nextcloud: ['34', '35']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: app-js
          path: js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Nextcloud ${{ matrix.nextcloud }} with the app
        run: dev/up.sh ${{ matrix.nextcloud }}
      - name: Run end-to-end tests
        run: npm run e2e
      - name: Nextcloud log on failure
        if: failure()
        run: docker compose -f dev/docker-compose.yml exec -T nextcloud sh -c 'tail -n 200 /var/www/html/data/nextcloud.log' || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-nc${{ matrix.nextcloud }}
          path: |
            playwright-report
            test-results
          retention-days: 7
